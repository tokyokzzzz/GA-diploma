version: '3.8'

services:
  db:
    image: postgres:15
    container_name: django_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password   # <- change this to a strong password
      POSTGRES_DB: django
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    command: gunicorn productivity_app.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: django
      DB_USER: postgres
      DB_PASSWORD: your_password
      DB_HOST: db
    restart: always

volumes:
  postgres_data:
